[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rayplot"
dynamic = ["version"]
description = "Path-traced 3-D scatter plots over a shadow-catching floor, with notebook and browser viewers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
# mitsuba: the `ellipsoids` shape needs 3.7; only 3.9 has been tested.
dependencies = ["mitsuba>=3.9", "numpy", "pillow", "torch", "matplotlib"]

[project.optional-dependencies]
notebook = ["anywidget"]
browser = ["aiohttp"]
all = ["anywidget", "aiohttp"]
dev = ["anywidget", "aiohttp", "pytest"]

[tool.setuptools.dynamic]
version = { attr = "rayplot.__version__" }

[tool.setuptools.package-data]
rayplot = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
